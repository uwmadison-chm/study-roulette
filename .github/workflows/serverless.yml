name: serverless

on:
  push:
    paths: ["serverless/**", ".github/workflows/serverless.yml"]
  pull_request:
    paths: ["serverless/**", ".github/workflows/serverless.yml"]

defaults:
  run:
    working-directory: serverless

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.ts --config studies.example.json

  minio:
    # Proves the S3 store's conditional creates against a real S3 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - name: Start MinIO
        # Docker Hub and quay.io no longer serve MinIO images publicly; Chainguard does
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Check conditional writes
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: roulette
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: node scripts/check-store.ts --create-bucket
      - name: Migrate Python mappings, keeping their timestamps
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: roulette
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: |
          dir=$(mktemp -d)
          key=$(printf 'migrate-check-%s' "$GITHUB_RUN_ID" | sha256sum | cut -d' ' -f1)
          echo "https://example.com/legacy?id=1" > "$dir/$key"
          touch -d 2020-01-02T03:04:05Z "$dir/$key"
          node scripts/migrate.ts "$dir" | tee out1
          grep -q "1 created" out1
          node scripts/migrate.ts "$dir" | tee out2
          grep -q "1 already present (0 conflicting)" out2
          KEY=$key node --input-type=module -e '
            import { s3StoreFromEnv } from "./src/store/s3.ts";
            const e = await s3StoreFromEnv(process.env).get(process.env.KEY);
            console.log(e);
            if (e?.created !== Date.parse("2020-01-02T03:04:05Z")) process.exit(1);
          '
