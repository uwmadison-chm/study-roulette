name: serverless

on:
  push:
    paths: ["serverless/**", ".github/workflows/serverless.yml"]
  pull_request:
    paths: ["serverless/**", ".github/workflows/serverless.yml"]

defaults:
  run:
    working-directory: serverless

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.ts --config studies.example.json

  minio:
    # Proves the S3 store's conditional creates against a real S3 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - name: Start MinIO
        # Docker Hub and quay.io no longer serve MinIO images publicly; Chainguard does
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
      - name: Check conditional writes
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: roulette
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: node scripts/check-store.ts --create-bucket
      - name: End to end through the Node server
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: roulette
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          PORT: 8787
        run: |
          node scripts/build.ts --config studies.example.json
          node dist/node/server.mjs > server.log &
          for i in $(seq 20); do curl -s -o /dev/null localhost:8787/ && break; sleep 0.5; done
          run=$GITHUB_RUN_ID
          for id in 1 2 3 4 5 5 5; do curl -s -o /dev/null -w "%{http_code} %{redirect_url}\n" "localhost:8787/?id=$run-$id"; done
          cat server.log
          test "$(grep -c '"outcome":"created"' server.log)" -eq 5
          test "$(grep -c '"outcome":"existing"' server.log)" -eq 2
