name: serverless

on:
  push:
    paths: ["serverless/**", ".github/workflows/serverless.yml"]
  pull_request:
    paths: ["serverless/**", ".github/workflows/serverless.yml"]

defaults:
  run:
    working-directory: serverless

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/build.ts --config studies.example.json

  minio:
    # Proves the S3 store's conditional creates against a real S3 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serverless/package-lock.json
      - run: npm ci
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio server /data
          for i in $(seq 30); do curl -sf http://localhost:9000/minio/health/live && break; sleep 1; done
          docker run --rm --network host --entrypoint sh minio/mc -c \
            "mc alias set local http://localhost:9000 minioadmin minioadmin && mc mb local/roulette"
      - name: Check conditional writes
        env:
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: roulette
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
        run: node scripts/check-store.ts
